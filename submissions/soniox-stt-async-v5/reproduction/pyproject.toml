[project]
name = "danish-open-whisper"
version = "0.1.0"
description = "Reproducible Danish speech recognition research"
requires-python = ">=3.11,<3.12"
dependencies = [
    "danish-asr-leaderboard",
    "espnet==202511",
    "espnet-model-zoo==0.1.7",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "datasets==3.6.0",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "librosa==0.11.0",
    "hf-xet==1.6.0",
    "wandb==0.30.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["ruff==0.13.2"]

[tool.uv.sources]
danish-asr-leaderboard = { git = "https://github.com/Rye-A1/danish-asr-leaderboard", rev = "dff9607fe1a84a7f1a64a0bb2ec75e7885568ebc" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
extend-exclude = [".cache"]
