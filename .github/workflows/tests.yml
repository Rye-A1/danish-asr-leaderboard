name: Tests

# Runs the unit suite on every push and pull request. Deliberately a separate
# workflow from deploy-space.yml: that one only triggers on space/** changes, so it
# would never exercise a change to the scoring/normalizer code. This one covers the
# whole repo so e.g. a regression in danish_asr_leaderboard/ is caught before merge.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        # Use plain pip (not uv pip) — uv pip does universal cross-version resolution
        # which hits conflicts between the optional ML extras (nemo vs vibevoice) even
        # though those extras are never installed in CI.
        run: |
          pip install -e . pytest pillow numpy requests
          pytest tests/ -q

      # After the tests, so their result is always visible even when this fails.
      # Pyflakes rules only (see [tool.ruff.lint] in pyproject.toml): scripts like
      # update_space.py run only at deploy, so an undefined name there is invisible
      # to the unit suite until it takes the deploy down -- which is exactly what
      # happened. Pinned so a new ruff release cannot fail an unrelated PR.
      - name: Lint
        run: |
          pip install ruff==0.14.0
          ruff check .
