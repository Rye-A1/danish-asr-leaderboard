name: Pilot model profile reviewer

on:
  pull_request:
    paths:
      - '.github/workflows/pilot-model-profile-agent.yml'
      - 'scripts/model_profile_agent.py'

jobs:
  compare:
    if: github.event.pull_request.number == 98
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: nemotron-super
            model: nvidia/nemotron-3-super-120b-a12b:free
            provider: nvidia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Collect public evidence leads
        run: python scripts/refresh_model_profile_candidates.py
      - name: Draft Edda v0.1 review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ matrix.model }}
          OPENROUTER_PROVIDER: ${{ matrix.provider }}
          PROFILE_AGENT_MODEL_ID: danish-foundation-models/edda-v0.1
        run: python scripts/model_profile_agent.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-review-${{ matrix.id }}
          path: scripts/model_profile_agent_suggestions.json
          if-no-files-found: error
