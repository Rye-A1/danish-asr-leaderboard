name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - 'huggingface/space/**'
      - 'results/**'
      - 'outputs/**'
      - 'scripts/update_space.py'
      - 'huggingface/hf_downloads.json'
      - 'huggingface/dataset_card.md'
      - 'assets/fonts/**'
      - 'scripts/push_results.py'
      - 'scripts/push_outputs.py'
      - 'scripts/extract_compare_metadata.py'
      - 'scripts/build_compare_data.py'
      - 'scripts/update_dataset_card.py'
      - '.github/workflows/deploy-space.yml'
  workflow_dispatch:

jobs:
  deploy-space:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Push outputs to HF dataset
        run: uv run --no-project --with pandas --with pyarrow --with huggingface_hub python scripts/push_outputs.py

      - name: Push results to HF dataset
        run: uv run --no-project --with pandas --with pyarrow --with huggingface_hub python scripts/push_results.py

      - name: Check every result has raw outputs
        # Models reach the board by two paths: contributor PRs carrying
        # results/ + outputs/, and our own eval runs pushing outputs straight to
        # the dataset. Nothing compared the two, so a model could publish a score
        # with no raw outputs and therefore no confidence interval — which is
        # exactly what ordbogen/whisper did, unnoticed, from August 2026.
        # Runs before the interval step because those parquets are its input.
        run: |
          pip install -e . huggingface_hub
          python scripts/check_dataset_consistency.py

      - name: Update confidence intervals
        # Must run after the outputs push and before the Space deploy. Unchanged
        # output hashes reuse published intervals; new or changed models are
        # recomputed and the manifest is uploaded with the interval file.
        #
        # Unlike the steps around it, compute_ci.py imports danish_asr_leaderboard
        # (metrics + normalizer), so the package has to be installed rather than run
        # with --no-project. Plain pip for the reason documented in tests.yml.
        run: |
          pip install -e . pandas pyarrow huggingface_hub
          python scripts/compute_ci.py

      - name: Refresh dataset viewer configs
        run: uv run --no-project --with huggingface_hub --with pyyaml python scripts/update_dataset_card.py

      - name: Check Compare cache
        id: compare_cache
        run: |
          set +e
          python scripts/build_compare_data.py \
            --check-only \
            --preserve-examples-from huggingface/space/compare_data.json \
            --require-results-dir results
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Rebuild Compare data
        if: steps.compare_cache.outputs.rebuild == 'true'
        # CoRal speaker labels are gated. HF_TOKEN needs read access; the
        # clip-level metadata stays in the runner's temporary directory.
        run: |
          python scripts/extract_compare_metadata.py --out "$RUNNER_TEMP/compare-metadata.jsonl"
          python scripts/build_compare_data.py \
            --metadata "$RUNNER_TEMP/compare-metadata.jsonl" \
            --cache-dir "$RUNNER_TEMP/compare-hf" \
            --preserve-examples-from huggingface/space/compare_data.json \
            --reuse-published \
            --require-results-dir results

      - name: Deploy Space
        run: uv run --no-project --with pandas --with pyarrow --with requests --with huggingface_hub --with pillow --with numpy python scripts/update_space.py
