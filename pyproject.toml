[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danish-asr-leaderboard"
version = "0.1.0"
description = "Reproducible benchmark and leaderboard for Danish automatic speech recognition"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Emil Schledermann / RyeAI" }]
keywords = ["asr", "speech-recognition", "danish", "benchmark", "leaderboard", "wer"]

# Core dependencies shared by every backend. Backend-specific extras (NeMo,
# transformers, API SDKs, ...) live in requirements/<backend>.txt so users
# only install what they need.
dependencies = [
    "datasets>=2.19.0",
    "huggingface_hub>=0.23.0",
    "num2words>=0.5.14",
    # Folds spelled-out numerals to digits ahead of num2words; part of the
    # published normalisation (see normalizer/danish.py).
    "text2num>=3.1.0",
    # Edit distance behind WER/CER. Was pulled in transitively via jiwer, which
    # metrics.py no longer uses now that the corpus rate is computed directly.
    "rapidfuzz>=3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "soundfile>=0.12.1",
]

[project.urls]
Homepage = "https://github.com/Rye-A1/danish-asr-leaderboard"
Leaderboard = "https://huggingface.co/spaces/RyeAI/danish-asr-leaderboard"
Results = "https://huggingface.co/datasets/RyeAI/danish-asr-leaderboard"

[project.scripts]
danish-asr-eval = "danish_asr_leaderboard.cli:main"

[project.optional-dependencies]
transformers   = ["torch>=2.0.0", "transformers>=4.54.0"]
wav2vec2       = ["torch>=2.0.0", "transformers>=4.54.0",
                  # n-gram LM decoding for repos shipping language_model/
                  # (CoRal Røst, MediaCatch) — worth ~6pp WER on those models.
                  "pyctcdecode>=0.5.0", "kenlm>=0.2.0", "soundfile>=0.12.1"]
faster-whisper = ["faster-whisper>=1.0.3"]
qwen-asr       = ["torch>=2.0.0", "transformers>=4.54.0", "qwen-asr>=0.0.6"]
nemo           = ["torch>=2.0.0", "nemo_toolkit[asr]>=2.4.0"]
voxtral        = ["torch>=2.0.0", "transformers>=4.54.0", "mistral-common[audio]>=1.8.1"]
seamless       = ["torch>=2.0.0", "transformers>=4.54.0"]
cohere-asr     = ["torch>=2.0.0", "transformers>=4.54", "librosa>=0.10", "sentencepiece>=0.1.99"]
vibevoice      = ["torch>=2.0.0", "transformers>=5.3.0"]
elevenlabs     = ["elevenlabs>=1.0.0"]
azure-openai   = ["openai>=1.0.0"]
ordbogen       = ["openai>=1.0.0"]
google-chirp   = ["google-cloud-speech>=2.26.0"]
soniox         = ["soniox>=0.1.0"]
dev            = ["pytest>=8.0"]

[dependency-groups]
deploy = [
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["danish_asr_leaderboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["node_modules", ".venv"]

[tool.ruff.lint]
# Deliberately narrow. The F (pyflakes) rules catch the class of bug that
# actually reached production here: an undefined name in scripts/update_space.py,
# which only runs at deploy time, so the unit suite could not see it and it took
# the deploy down instead. Style rules stay off, so a lint failure always means
# something is broken rather than merely untidy.
select = ["F"]
